version: '3.9'

services:

  frontend:
    build: ./Frontend(IA)
    ports:
      - "3000:5173"
    depends_on:
      - backend

  backend:
    build: ./Backend(IA)
    ports:
      - "5000:8080"
    depends_on:
      - db
    environment:
      - ConnectionStrings__HMConnection=Server=db;Database=VendorHubDb;User Id=sa;Password=YourStrong@123;TrustServerCertificate=True;

  db:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      SA_PASSWORD: "YourStrong@123"
      ACCEPT_EULA: "Y"
    ports:
      - "1433:1433"